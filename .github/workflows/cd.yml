name: cd

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  ANDROID_SDK_HOME: /usr/local/lib/android/sdk

jobs:
  android:
    runs-on: nested
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/cache@v4
        id: sdk-cache
        with:
          path: |
            ${{ env.ANDROID_SDK_HOME }}/platforms/android-37.0
            ${{ env.ANDROID_SDK_HOME }}/build-tools/37.0.0
          key: android-sdk-37.0

      - uses: android-actions/setup-android@v3
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.7.0"

      - uses: extractions/setup-just@v4

      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        run: just build

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release:
    runs-on: nested
    needs: [android]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
