name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: "9.7.0"

jobs:
  kotlin:
    runs-on: pool
    steps:
      - uses: actions/checkout@v7

      - uses: wprhvso/qa-kotlin@v1
        with:
          working-directory: android

  android:
    runs-on: pool
    steps:
      - uses: actions/checkout@v7

      - uses: wprhvso/qa-kotlin@v1
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        with:
          checks: test,build
          working-directory: android
          gradle-version: ${{ env.GRADLE_VERSION }}
          setup-java: "false"
