name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_SDK_HOME: /usr/local/lib/android/sdk
  GRADLE_VERSION: "9.7.0"

jobs:
  kotlin:
    runs-on: nested
    steps:
      - uses: actions/checkout@v7

      - uses: wprhvso/qa-kotlin@v1
        with:
          working-directory: android

  android:
    runs-on: nested
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/cache@v4
        id: sdk-cache
        with:
          path: |
            ${{ env.ANDROID_SDK_HOME }}/platforms/android-37.0
            ${{ env.ANDROID_SDK_HOME }}/build-tools/37.0.0
          key: android-sdk-37.0

      - uses: android-actions/setup-android@v3
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"

      - uses: wprhvso/qa-kotlin@v1
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        with:
          checks: test,build
          working-directory: android
          gradle-version: ${{ env.GRADLE_VERSION }}
          setup-java: "false"
