pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
// Удалённый build cache включается только когда воркер положил учётные данные
// в ~/.gradle/gradle.properties. Локально их нет — сборка идёт на локальном
// кеше и ничего не ломается.
def cacheUrl = providers.gradleProperty("gradleCacheUrl").orNull
def cacheUser = providers.gradleProperty("gradleCacheUsername").orNull
def cachePassword = providers.gradleProperty("gradleCachePassword").orNull

buildCache {
    local {
        enabled = true
    }
    if (cacheUrl && cacheUser && cachePassword) {
        remote(HttpBuildCache) {
            url = cacheUrl
            push = true
            credentials {
                username = cacheUser
                password = cachePassword
            }
        }
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "prn-tracker-android"
include ':app'
